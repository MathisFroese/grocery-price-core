[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grocery-price-core"
version = "0.1.0"
description = "Provenance-aware, dependency-free grocery price comparison primitives"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Mathis Froese"}]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Operating System :: OS Independent"]

[tool.setuptools.packages.find]
where = ["src"]
