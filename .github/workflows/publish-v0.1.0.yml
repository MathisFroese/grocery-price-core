name: Publish initial v0.1.0 release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.1.0.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run synthetic unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish v0.1.0 once, only after tests pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 > /dev/null 2>&1; then
            echo "v0.1.0 is already published."
          else
            gh release create v0.1.0 --target "$GITHUB_SHA" \
              --title "v0.1.0 — Initial public release" \
              --notes-file RELEASE_NOTES.md
          fi
